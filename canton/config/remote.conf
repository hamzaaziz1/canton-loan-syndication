# Remote console view of the running network, used by admin scripts in
# canton/admin via `make console SCRIPT=<name>`. Admin APIs use mutual TLS
# with the console's own client certificate; public and ledger APIs are
# still plaintext and move to TLS in later steps.
_console_tls {
  client-cert {
    cert-chain-file  = "/app/tls/tls.crt"
    private-key-file = "/app/tls/tls.pem"
  }
  trust-collection-file = "/app/tls/root-ca.crt"
}
_console_ledger_tls {
  trust-collection-file = "/app/tls/root-ca.crt"
}
canton {
  remote-sequencers {
    sequencer1 {
      public-api { address = "synchronizer", port = 5008 }
      admin-api  { address = "synchronizer", port = 5009, tls = ${_console_tls} }
    }
  }
  remote-mediators {
    mediator1 {
      admin-api { address = "synchronizer", port = 5007, tls = ${_console_tls} }
    }
  }
  remote-participants {
    agent {
      ledger-api { address = "participant-agent", port = 5001, tls = ${_console_ledger_tls} }
      admin-api  { address = "participant-agent", port = 5002, tls = ${_console_tls} }
    }
    lendera {
      ledger-api { address = "participant-lendera", port = 5001, tls = ${_console_ledger_tls} }
      admin-api  { address = "participant-lendera", port = 5002, tls = ${_console_tls} }
    }
    lenderb {
      ledger-api { address = "participant-lenderb", port = 5001, tls = ${_console_ledger_tls} }
      admin-api  { address = "participant-lenderb", port = 5002, tls = ${_console_tls} }
    }
    borrower {
      ledger-api { address = "participant-borrower", port = 5001, tls = ${_console_ledger_tls} }
      admin-api  { address = "participant-borrower", port = 5002, tls = ${_console_tls} }
    }
  }
}
