# Remote console view of the running network, used by admin scripts in
# canton/admin via `make console SCRIPT=<name>`. Plaintext until TLS lands.
canton {
  remote-sequencers {
    sequencer1 {
      public-api { address = "synchronizer", port = 5008 }
      admin-api  { address = "synchronizer", port = 5009 }
    }
  }
  remote-mediators {
    mediator1 {
      admin-api { address = "synchronizer", port = 5007 }
    }
  }
  remote-participants {
    agent {
      ledger-api { address = "participant-agent", port = 5001 }
      admin-api  { address = "participant-agent", port = 5002 }
    }
    lendera {
      ledger-api { address = "participant-lendera", port = 5001 }
      admin-api  { address = "participant-lendera", port = 5002 }
    }
    lenderb {
      ledger-api { address = "participant-lenderb", port = 5001 }
      admin-api  { address = "participant-lenderb", port = 5002 }
    }
    borrower {
      ledger-api { address = "participant-borrower", port = 5001 }
      admin-api  { address = "participant-borrower", port = 5002 }
    }
  }
}
