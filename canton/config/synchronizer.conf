# Synchronizer node: sequencer and mediator in one JVM, run by one operator.
# Storage extends the image's _storage template (/app/storage.conf).
# Credentials come from POSTGRES_USER and POSTGRES_PASSWORD.
include required(file("/app/storage.conf"))
include required(file("/app/tls-shared.conf"))

canton {
  sequencers {
    sequencer1 {
      storage = ${_storage}
      storage.config.properties.serverName = "postgres"
      storage.config.properties.databaseName = "sequencer"
      storage.parameters.max-connections = 10

      public-api {
        address = "0.0.0.0"
        port = 5008
      }
      admin-api {
        address = "0.0.0.0"
        port = 5009
        tls = ${_tls.admin-api}
      }

      sequencer.type = BFT
    }
  }

  mediators {
    mediator1 {
      storage = ${_storage}
      storage.config.properties.serverName = "postgres"
      storage.config.properties.databaseName = "mediator"
      storage.parameters.max-connections = 6

      admin-api {
        address = "0.0.0.0"
        port = 5007
        tls = ${_tls.admin-api}
      }
    }
  }
}
