# TLS settings shared by every node. Each container mounts only its own
# certificate and key at /app/tls (see scripts/gen-dev-certs.sh).
_tls {
  admin-api {
    cert-chain-file       = "/app/tls/tls.crt"
    private-key-file      = "/app/tls/tls.pem"
    trust-collection-file = "/app/tls/root-ca.crt"
    client-auth {
      type = require
      # the node's own bootstrap script calls this API too, so it needs a client cert
      admin-client {
        cert-chain-file  = "/app/tls/tls.crt"
        private-key-file = "/app/tls/tls.pem"
      }
    }
  }
  ledger-api {
    cert-chain-file       = "/app/tls/tls.crt"
    private-key-file      = "/app/tls/tls.pem"
    # canton's own json api connects to the grpc ledger api, so it must trust our ca
    trust-collection-file = "/app/tls/root-ca.crt"
  }
}

# Ledger API authorization: RS256 tokens signed by the dev token issuer, whose
# certificate (public half only) is mounted at /app/jwt/issuer.crt.
_auth {
  ledger-api = [{
    type        = jwt-rs-256-crt
    certificate = "/app/jwt/issuer.crt"
  }]
}
