# Participant node "lenderb". Storage extends the image's _storage template.
# Credentials come from POSTGRES_USER and POSTGRES_PASSWORD.
include required(file("/app/storage.conf"))
include required(file("/app/tls-shared.conf"))

canton {
  participants {
    lenderb {
      storage = ${_storage}
      storage.config.properties.serverName = "postgres"
      storage.config.properties.databaseName = "participant_lenderb"
      storage.parameters.max-connections = 16

      ledger-api {
        address = "0.0.0.0"
        port = 5001
      }
      admin-api {
        address = "0.0.0.0"
        port = 5002
        tls = ${_tls.admin-api}
      }
      # JSON ledger API, required in 3.6; internal to the compose network for now
      http-ledger-api.port = 7575
    }
  }
}
