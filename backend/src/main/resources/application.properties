spring.application.name=loansync-backend

# Which organisation this instance serves (ADR 0003); set by the profile.
loansync.org=agent

# Read model: one schema per organisation in the projector database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/projector?currentSchema=${loansync.org}
spring.datasource.username=projector
spring.datasource.password=${PROJECTOR_DB_PASSWORD}
spring.flyway.schemas=${loansync.org}
spring.flyway.default-schema=${loansync.org}

# This organisation's participant ledger API, over TLS with the network CA.
loansync.ledger.host=${LEDGER_HOST:localhost}
loansync.ledger.ca=${LEDGER_CA:../canton/tls/ca/root-ca.crt}
# This instance's short-lived access token, kept fresh by scripts/token-refresher.sh
loansync.ledger.token-file=${LEDGER_TOKEN_FILE:../canton/jwt/tokens/${loansync.ledger.user}.jwt}

management.endpoints.web.exposure.include=health,info

# Listen on localhost only: the REST API has no authentication of its own yet (M7)
server.address=127.0.0.1
